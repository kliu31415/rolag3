[package]
name = "rolag3"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.release-lto]
inherits = "release"
lto = "thin"

[dependencies]
bumpalo = { version = "3.14.0", features = [ "collections" ]}
bytemuck = { version = "1.14.0", features = [ "derive" ]}
cosmic-text = "0.10.0"
env_logger = "0.10.1"
image = "0.24.7"
log = "0.4.20"
once_cell = "1.19.0"
pollster = "0.3.0"
rand = "0.8.5"
rayon = "1.8.0"
smaa = "0.12.0"
time = { version = "0.3.31", features = ["formatting"]}
wgpu = "0.18.0"
winit = { version = "0.29.4", features = ["rwh_05"]}
